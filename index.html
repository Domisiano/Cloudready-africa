<script>
var topics=[{id:'cloud',name:'Cloud concepts'},{id:'architecture',name:'Azure architecture & services'},{id:'governance',name:'Management & governance'}];
var qs=[
{t:'cloud',d:'Easy',q:'A Kampala shop wants to use complete software over the internet without managing the servers. Which service model fits?',a:['IaaS','PaaS','SaaS','On-premises'],c:2,e:'SaaS delivers a ready-to-use application over the internet. The provider manages the application and underlying infrastructure.',w:['IaaS gives the customer more infrastructure responsibility.','PaaS provides a managed platform for building and deploying applications.','Correct: SaaS is ready-to-use software delivered as a service.','On-premises means the organization operates local infrastructure.']},
{t:'cloud',d:'Easy',q:'A company pays according to how much cloud resource it consumes. What is this called?',a:['Capital expenditure','Consumption-based pricing','Fixed capacity','Manual provisioning'],c:1,e:'Consumption-based pricing ties cost to measured usage. Monitoring is still important to control spending.',w:['Owning hardware often requires upfront capital spending.','Correct: charges are based on measured usage.','Cloud capacity can often be adjusted.','Manual provisioning is an operational process.']},
{t:'cloud',d:'Medium',q:'An online shop adds resources as visitor numbers grow. Which concept describes increasing capacity to meet demand?',a:['Governance','Scalability','Compliance','Data residency'],c:1,e:'Scalability is the ability to increase or decrease capacity to meet workload needs. Elasticity emphasizes dynamic adjustment as demand changes.',w:['Governance sets policies and controls.','Correct: scalability adjusts capacity to workload needs.','Compliance is meeting rules and requirements.','Data residency concerns where data is stored.']},
{t:'cloud',d:'Medium',q:'What does the shared responsibility model explain?',a:['The customer is responsible for everything.','The provider is responsible for everything.','Provider and customer responsibilities are divided depending on the service.','It applies only to billing.'],c:2,e:'Cloud security responsibilities are shared. The exact division changes by service model; customers still manage identities, data and access settings.',w:['The customer does not manage all physical infrastructure.','Customers still have configuration and access responsibilities.','Correct: responsibility is divided and varies by service.','It includes security and operations, not only billing.']},
{t:'cloud',d:'Easy',q:'Which deployment model combines private infrastructure with public cloud services?',a:['Public cloud only','Hybrid cloud','Private cloud only','Offline cloud'],c:1,e:'Hybrid cloud combines private infrastructure or services with public cloud services.',w:['Public-only uses public cloud services.','Correct: hybrid combines private and public environments.','Private-only does not combine with public cloud.','Offline cloud is not a standard deployment model.']},
{t:'cloud',d:'Medium',q:'Capacity automatically expands and shrinks as demand changes. Which term best describes this?',a:['Elasticity','Governance','Latency','Data sovereignty'],c:0,e:'Elasticity means capacity can dynamically expand or shrink in response to demand.',w:['Correct: elasticity adapts capacity as demand changes.','Governance defines rules and controls.','Latency is response or transfer delay.','Data sovereignty relates to legal jurisdiction over data.']},
{t:'architecture',d:'Easy',q:'What is an Azure region?',a:['A billing invoice','A geographic area containing one or more datacenters','A user password','A database query'],c:1,e:'An Azure region is a geographic area containing one or more datacenters connected through a low-latency network.',w:['Invoices record charges.','Correct: a region is a geographic area with datacenters.','Passwords are authentication credentials.','Queries request or change data.']},
{t:'architecture',d:'Medium',q:'Why deploy resources across availability zones in a supported region?',a:['Remove all security responsibilities','Improve resilience to a datacenter-level failure','Make every service free','Avoid choosing a region'],c:1,e:'Availability zones are physically separate locations within a region and can improve resilience to localized datacenter failures.',w:['Customers retain security responsibilities.','Correct: separate zones can protect against localized failures.','Zones do not remove service charges.','Resources still belong to a region.']},
{t:'architecture',d:'Easy',q:'What logically groups Azure resources that are managed together?',a:['Resource group','Availability zone','Azure region','IP address'],c:0,e:'A resource group is a logical container for Azure resources managed together.',w:['Correct: resource groups organize related resources.','A zone is a physical location.','A region is a geographic area.','An IP address identifies a network endpoint.']},
{t:'architecture',d:'Medium',q:'Which Azure service provides a private network environment for virtual machines to communicate?',a:['Azure Virtual Network','Azure Cost Management','Microsoft Entra ID','Azure Advisor'],c:0,e:'Azure Virtual Network provides private networking for Azure resources and supports connectivity and network controls.',w:['Correct: virtual networks provide private network connectivity.','Cost Management analyzes spending.','Entra ID manages identities and access.','Advisor provides recommendations.']},
{t:'architecture',d:'Easy',q:'Which service stores unstructured objects such as images and documents?',a:['Azure Blob Storage','Azure Virtual Desktop','Azure DNS','Azure Policy'],c:0,e:'Azure Blob Storage stores unstructured object data such as images, videos, backups and documents.',w:['Correct: Blob Storage is object storage.','Virtual Desktop delivers desktop experiences.','DNS resolves domain names.','Policy helps enforce standards.']},
{t:'architecture',d:'Medium',q:'A developer wants to run code in response to events without managing servers. Which category fits?',a:['Serverless computing','Physical colocation','Manual patching','Local-only storage'],c:0,e:'Serverless computing lets developers run code while the provider manages much of the underlying infrastructure. Servers still exist behind the scenes.',w:['Correct: serverless abstracts much of server management.','Colocation involves physical infrastructure.','Patching is an operational task.','Storage alone does not run event-triggered code.']},
{t:'architecture',d:'Medium',q:'What is a key purpose of an Azure subscription?',a:['Organize resources, billing and access boundaries','Act as a physical datacenter','Replace all resource groups','Store only images'],c:0,e:'A subscription is an important management and billing boundary for Azure resources.',w:['Correct: subscriptions help organize management and billing.','Datacenters are physical facilities.','Resource groups organize resources within a subscription.','Subscriptions are not image storage services.']},
{t:'governance',d:'Easy',q:'Which service manages identities and access to Microsoft cloud resources?',a:['Microsoft Entra ID','Azure Blob Storage','Azure Monitor','Azure Marketplace'],c:0,e:'Microsoft Entra ID provides identity and access management, including authentication and identity-based controls.',w:['Correct: Entra ID manages identities and access.','Blob Storage stores objects.','Monitor analyzes telemetry.','Marketplace lists solutions.']},
{t:'governance',d:'Medium',q:'Which feature helps prevent resources being created in unapproved Azure regions?',a:['Azure Policy','Azure Blob Storage','Availability sets only','Azure DNS'],c:0,e:'Azure Policy evaluates resources against organizational rules and can help enforce allowed locations.',w:['Correct: Policy evaluates and enforces standards.','Blob Storage stores data.','Availability sets help VM availability.','DNS resolves names.']},
{t:'governance',d:'Easy',q:'Which tool estimates expected Azure costs before deploying resources?',a:['Azure Pricing Calculator','Azure DNS','Microsoft Entra ID','Azure Service Health'],c:0,e:'The Azure Pricing Calculator helps estimate costs for Azure products and configurations before deployment.',w:['Correct: the calculator estimates costs.','DNS resolves domain names.','Entra ID manages identity.','Service Health provides service issue information.']},
{t:'governance',d:'Medium',q:'Which service collects metrics and logs and supports alerts and monitoring?',a:['Azure Monitor','Azure Policy only','Template gallery only','Microsoft Purview only'],c:0,e:'Azure Monitor collects and analyzes telemetry such as metrics and logs and supports alerts.',w:['Correct: Azure Monitor is the monitoring platform.','Policy focuses on rules and compliance.','Templates help deploy resources.','Purview focuses on data governance.']},
{t:'governance',d:'Medium',q:'Which service recommends ways to improve reliability, security and cost efficiency?',a:['Azure Advisor','Azure DNS','Azure Blob Storage','Azure Bastion only'],c:0,e:'Azure Advisor offers recommendations for reliability, security, performance, operational excellence and cost.',w:['Correct: Advisor provides optimization recommendations.','DNS handles name resolution.','Blob Storage stores objects.','Bastion provides secure VM connectivity.']},
{t:'governance',d:'Medium',q:'What is the principle of least privilege?',a:['Give everyone administrator access','Give users only the access needed for their tasks','Disable identity controls','Share one account across the team'],c:1,e:'Least privilege limits access to the minimum needed to perform a responsibility.',w:['Broad admin access increases risk.','Correct: provide only necessary permissions.','Identity controls are important security measures.','Shared accounts reduce accountability.']},
{t:'cloud',d:'Easy',q:'A service remains accessible despite a component failure. Which concept is this?',a:['High availability','Consumption billing','Data classification','Resource tagging'],c:0,e:'High availability aims to keep a service operational through redundancy and resilient design.',w:['Correct: high availability focuses on service availability.','Billing measures usage and charges.','Classification categorizes data.','Tags add metadata to resources.']}
];
var fc=[
['cloud','What is cloud computing?','Using computing services over a network instead of owning and operating all the hardware yourself.','Like paying for electricity you use instead of buying a generator for every need.'],
['cloud','IaaS vs PaaS vs SaaS','IaaS offers infrastructure; PaaS offers a managed platform to build apps; SaaS offers ready-to-use software.','Think of renting a shop space, using a fitted workspace, or using a finished service.'],
['cloud','Scalability vs elasticity','Scalability changes capacity to meet needs; elasticity emphasizes dynamic changes as demand changes.','A delivery service adds riders for a busy season and adjusts capacity as orders change.'],
['cloud','Shared responsibility','Cloud security duties are divided between the provider and customer. The split depends on the service.','A landlord maintains the building, while a shop owner protects stock and controls keys.'],
['cloud','Hybrid cloud','Combines private infrastructure or services with public cloud services.','A clinic keeps some systems locally and uses cloud services for others.'],
['architecture','Azure region','A geographic area containing one or more datacenters connected through a low-latency network.','A regional service hub with facilities in one geographic area.'],
['architecture','Availability zones','Physically separate locations within a region that can improve resilience.','Separate facilities reduce the chance one local incident affects every copy.'],
['architecture','Resource group','A logical container for Azure resources managed together.','A project folder for related cloud resources.'],
['architecture','Azure subscription','A boundary for managing resources, billing and access controls.','An account used to organize and account for a set of services.'],
['architecture','Azure Virtual Network','A private network environment for Azure resources.','A private office network for cloud resources.'],
['architecture','Azure Blob Storage','Object storage for unstructured data such as images, documents, videos and backups.','A digital warehouse for files that do not fit into rows and columns.'],
['architecture','Serverless','Run code without managing the underlying servers; servers still exist behind the scenes.','Focus on the service while the provider handles much of the infrastructure.'],
['governance','Microsoft Entra ID','A cloud identity and access management service.','A digital gatekeeper that checks who you are and what you can access.'],
['governance','Least privilege','Give each identity only the permissions required for its work.','Give staff keys to their work area, not every room.'],
['governance','Azure Policy','Assesses and helps enforce organizational rules for Azure resources.','A rulebook that checks projects against agreed standards.'],
['governance','Azure Monitor','Collects and analyzes telemetry such as metrics and logs, and supports alerts.','A control-room dashboard that flags unusual system behavior.'],
['governance','Azure Advisor','Provides recommendations to improve reliability, security, performance and cost.','A review that identifies where a system could be safer or cheaper.'],
['governance','Consumption pricing','Charges are based on measured usage of cloud services.','Pay for what you use rather than all possible capacity upfront.']
];
var key='cloudreadyAfricaProgress1',S;try{S=JSON.parse(localStorage.getItem(key))||{history:[],review:[],plan:null,minutes:25,date:'',streak:0,last:''}}catch(e){S={history:[],review:[],plan:null,minutes:25,date:'',streak:0,last:''}}
var page='Home',Q=[],qi=0,sel=-1,checked=false,filter='all',difficulty='all',F=[],fi=0,revealed=false,ffilter='all',detail='',session=null;
function save(){localStorage.setItem(key,JSON.stringify(S))}function today(){return new Date().toISOString().slice(0,10)}function tn(t){return topics.filter(x=>x.id===t)[0].name}function hist(){return S.history}function acc(){return hist().length?Math.round(hist().filter(x=>x.ok).length/hist().length*100):0}function mastery(t){var a=hist().filter(x=>x.t===t);return a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):0}
function visit(){if(S.last!==today()){var y=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.last===y?(S.streak||0)+1:1;S.last=today();save()}}
var pages=['Home','Quiz Coach','Study Buddy','Flashcards','Study Planner','Readiness'];
function go(p){page=p;render()}function topicBars(){return topics.map(function(t){return '<div class="topic"><div class="topicline"><span>'+t.name+'</span><span class="muted">'+mastery(t.id)+'% mastery</span></div><div class="progress"><span style="width:'+mastery(t.id)+'%"></span></div></div>'}).join('')}
function stat(l,v,f){return '<div class="card"><div class="statlabel">'+l+'</div><div class="num">'+v+'</div><div class="tiny muted">'+f+'</div></div>'}

function home(){return '<section class="hero"><div><div class="eyebrow">Your cloud learning journey starts here</div><h1>Cloud concepts.<br><span style="color:#78e2d4">Made clearer.</span></h1><p>Build confidence for AZ-900 with short practice sessions, friendly explanations and a learning plan that responds to what you need to revise.</p><div class="row"><button class="btn teal" onclick="startQuiz()">Start a practice quiz ↗</button><button class="btn" onclick="go(\'Study Buddy\')">Explore concepts</button></div><div class="tiny" style="color:#d1dbee">Original questions • African examples • No signup needed</div></div><div class="heroart"><div class="orb"><div class="cloud">☁</div></div></div></section><div class="grid stats">'+stat('Questions answered',hist().length,'Your completed attempts')+stat('Practice accuracy',hist().length?acc()+'%':'—','Based on recorded answers')+stat('Review topics',S.review.length,'Concept areas to revisit')+stat('Study streak',S.streak||0,'Days with a visit recorded')+'</div><div class="head"><div><h2>Your learning toolkit</h2><p>Choose what you want to practise today.</p></div></div><div class="grid features">'+feature('◎','Smart Quiz Coach','Original questions with explanations for correct and incorrect options.','Start practising','Quiz Coach')+feature('✦','Study Buddy','Plain-language explanations with relatable African examples.','Explore topics','Study Buddy')+feature('▤','Flashcard Coach','Review key ideas and revisit concepts you missed.','Review cards','Flashcards')+feature('◷','Personal Study Planner','Create a routine around your available time and target date.','Build my plan','Study Planner')+feature('↗','Readiness Tracker','See practice accuracy and topic-by-topic strengths.','View progress','Readiness')+feature('♧','Learn by doing','Turn mistakes into focused revision.','Try the loop','Quiz Coach')+'</div><div class="grid two" style="margin-top:17px"><div class="card"><h2>Topic progress</h2><p class="tiny muted">Mastery updates as you practise.</p>'+topicBars()+'</div><div class="card"><span class="pill">RECOMMENDED NEXT STEP</span><h3>'+(S.review.length?'Review your missed concepts':'Take a quick diagnostic')+'</h3><p class="tiny muted">'+(S.review.length?'You have '+S.review.length+' topic(s) queued for revision.':'A short quiz reveals which topics deserve attention.')+'</p><button class="btn primary" onclick="'+(S.review.length?'go(\'Flashcards\')':'startQuiz()')+'">'+(S.review.length?'Open review cards':'Start diagnostic')+' →</button><div class="notice">Independent, unofficial study aid. Not affiliated with Microsoft. No real exam questions are reproduced.</div></div></div>'}
function startQuiz(){Q=qs.filter(function(q){return(filter==='all'||q.t===filter)&&(difficulty==='all'||q.d===difficulty)}).sort(function(){return Math.random()-.5}).slice(0,10);qi=0;sel=-1;checked=false;session={total:Q.length,correct:0,incorrect:[],topicCounts:{},started:today()};page='Quiz Coach';render()}
function quizPage(){if(!Q.length)Q=qs.slice(0,10);var q=Q[qi];var h='<div class="head"><div><h1>Smart Quiz Coach</h1><p>Original practice questions · Learn from every answer</p></div><span class="pill">'+(qi+1)+' of '+Q.length+'</span></div><div class="card"><div class="row"><span class="pill">'+tn(q.t)+'</span><span class="pill">'+q.d+'</span><span class="tiny muted">Question '+(qi+1)+'/'+Q.length+'</span></div><div class="progress"><span style="width:'+qi/Q.length*100+'%"></span></div><h2 class="question">'+q.q+'</h2><div class="answers">'+q.a.map(function(a,i){var cl='answer'+(sel===i?' selected':'')+(checked&&i===q.c?' correct':'')+(checked&&sel===i&&i!==q.c?' wrong':'');return '<button class="'+cl+'" '+(checked?'disabled':'')+' onclick="choose('+i+')"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+a+'</span></button>'}).join('')+'</div>';
if(checked){h+='<div class="feedback '+(sel===q.c?'':'wrong')+'"><h3>'+(sel===q.c?'✓ Correct answer':'↻ Let’s learn from this')+'</h3><p>'+q.e+'</p><p><b>Why each option?</b></p>'+q.w.map(function(w,i){return '<p><b>'+String.fromCharCode(65+i)+'.</b> '+w+'</p>'}).join('')+'<button class="btn" onclick="queue(\''+q.t+'\')">＋ Add topic to review</button></div>'}
h+='<div class="row">'+(!checked?'<button class="btn primary" '+(sel<0?'disabled':'')+' onclick="check()">Check answer</button>':'<button class="btn primary" onclick="nextQ()">'+(qi===Q.length-1?'Finish session':'Next question →')+'</button>')+'<button class="btn" onclick="startQuiz()">Restart quiz</button></div></div><div class="notice">Original practice content only. Not official exam questions.</div>';return h}
function choose(i){if(!checked){sel=i;render()}}function check(){if(sel<0||checked)return;var q=Q[qi],ok=sel===q.c;S.history.push({t:q.t,ok:ok,date:today()});if(!session)session={total:Q.length,correct:0,incorrect:[],topicCounts:{},started:today()};if(ok)session.correct++;else{session.incorrect.push({q:q.q,selected:q.a[sel],answer:q.a[q.c],explanation:q.e,topic:q.t});if(!S.review.includes(q.t))S.review.push(q.t)}session.topicCounts[q.t]=session.topicCounts[q.t]||{total:0,correct:0};session.topicCounts[q.t].total++;if(ok)session.topicCounts[q.t].correct++;checked=true;save();render()}function nextQ(){if(qi>=Q.length-1){if(session){S.attempts=S.attempts||[];S.attempts.push({date:today(),total:session.total,correct:session.correct,score:session.total?Math.round(session.correct/session.total*100):0,incorrect:session.incorrect,topicCounts:session.topicCounts});S.attempts=S.attempts.slice(-30);save()}Q=[];page='Readiness'}else{qi++;sel=-1;checked=false}render()}function queue(t){if(!S.review.includes(t))S.review.push(t);save();render()}
function buddy(){return '<div class="head"><div><h1>Study Buddy</h1><p>Cloud concepts explained simply, with examples from everyday life.</p></div><span class="pill green">GUIDED EXPLAINERS</span></div><div class="notice">This prototype uses curated explanations, not a connected live AI model. No API key is required.</div><div class="grid features">'+topics.map(function(t){return '<div class="card"><span class="pill">'+t.name+'</span><h3>'+t.name+'</h3><p class="muted">Explore the ideas, then practise the topic.</p><button type="button" class="btn" data-study-topic="'+t.id+'">Explore topic →</button></div>'}).join('')+'</div><div style="margin-top:18px">'+detail+'</div>'}
function showTopic(t){var topic=topics.find(function(x){return x.id===t});if(!topic)return;detail='<div class="card"><h2>'+topic.name+'</h2>'+fc.filter(function(c){return c[0]===t}).map(function(c){return '<div class="item"><div><h3>'+c[1]+'</h3><p>'+c[2]+'</p><p class="tiny muted"><b>Everyday example:</b> '+c[3]+'</p><button type="button" class="btn" data-review-topic="'+t+'">＋ Add topic to review</button></div></div>'}).join('')+'<button type="button" class="btn primary" data-practise-topic="'+t+'">Practise this topic →</button></div>';render()}
function flashPage(){F=ffilter==='review'?fc.filter(function(c){return S.review.includes(c[0])}):ffilter==='all'?fc:fc.filter(function(c){return c[0]===ffilter});if(!F.length)return '<div class="head"><h1>Flashcard Coach</h1></div><div class="card"><h2>No review cards queued</h2><p>Answer a quiz question incorrectly or add a topic from Study Buddy to create a review queue.</p><button class="btn primary" onclick="go(\'Quiz Coach\')">Practise a quiz</button></div>';if(fi>=F.length)fi=0;var c=F[fi];return '<div class="head"><div><h1>Flashcard Coach</h1><p>Use active recall to strengthen your memory.</p></div><span class="pill">'+(fi+1)+' of '+F.length+'</span></div><div class="row"><select class="select" onchange="ffilter=this.value;fi=0;revealed=false;render()"><option value="all">All flashcards</option><option value="review" '+(ffilter==='review'?'selected':'')+'>My review topics</option>'+topics.map(function(t){return '<option value="'+t.id+'" '+(ffilter===t.id?'selected':'')+'>'+t.name+'</option>'}).join('')+'</select><span class="tiny muted">'+tn(c[0])+'</span></div><div class="flash" onclick="revealed=!revealed;render()"><span class="pill">'+(revealed?'ANSWER':'QUESTION')+'</span><h2>'+c[1]+'</h2><p>'+(revealed?c[2]:'Pause and explain this concept in your own words, then reveal the answer.')+'</p>'+(revealed?'<p><b>Everyday example:</b> '+c[3]+'</p>':'')+'<span class="tiny muted">'+(revealed?'Tap to hide answer':'Tap card to reveal answer')+'</span></div><div class="row"><button class="btn" onclick="fi=(fi-1+F.length)%F.length;revealed=false;render()">← Previous</button><button class="btn primary" onclick="revealed=!revealed;render()">'+(revealed?'Hide answer':'Reveal answer')+'</button><button class="btn" onclick="fi=(fi+1)%F.length;revealed=false;render()">Next →</button><button class="btn" onclick="S.review=S.review.filter(function(x){return x!==c[0]});save();fi=(fi+1)%F.length;render()">✓ Know it</button><button class="btn" onclick="queue(c[0]);fi=(fi+1)%F.length;render()">↻ Review again</button></div>'}
function planner(){return '<div class="head"><div><h1>Personal Study Planner</h1><p>Build a manageable routine that fits your schedule.</p></div></div><div class="grid two"><div class="card"><h2>Set your study goal</h2><form onsubmit="makePlan(event)"><div class="field"><label>Time available per day</label><select class="select" id="mins"><option value="15">15 minutes</option><option value="25" selected>25 minutes</option><option value="45">45 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option></select></div><div class="field"><label>Target exam date (optional)</label><input class="input" type="date" id="examdate" min="'+today()+'" value="'+(S.date||'')+'"></div><div class="field"><label>Topics to prioritize</label>'+topics.map(function(t){return '<label class="check"><input type="checkbox" name="weak" value="'+t.id+'" '+(S.review.includes(t.id)?'checked':'')+'> '+t.name+'</label>'}).join('')+'</div><button class="btn primary">Generate my study plan →</button></form></div><div class="card"><span class="pill green">SUGGESTED ROUTINE</span><h3>Short sessions, steady progress</h3><div class="item"><div class="circle">1</div><div><b>Learn one concept</b><div class="tiny muted">Read an explainer and summarize it in one sentence.</div></div></div><div class="item"><div class="circle">2</div><div><b>Practise retrieval</b><div class="tiny muted">Answer questions without looking at your notes.</div></div></div><div class="item"><div class="circle">3</div><div><b>Review mistakes</b><div class="tiny muted">Revisit explanations and weak-topic cards.</div></div></div></div></div><div style="margin-top:18px">'+(S.plan?planHtml():'')+'</div>'}
function makePlan(e){e.preventDefault();S.minutes=Number(document.getElementById('mins').value);S.date=document.getElementById('examdate').value;var chosen=[].slice.call(document.querySelectorAll('input[name=weak]:checked')).map(function(x){return x.value});if(!chosen.length)chosen=S.review.length?S.review:topics.map(function(t){return t.id});var days=S.date?Math.max(1,Math.ceil((new Date(S.date)-new Date(today()))/86400000)):7;S.plan=[];for(var i=0;i<Math.min(days,14);i++)S.plan.push({day:i+1,t:chosen[i%chosen.length],task:['Learn the concept and study its flashcard','Complete a targeted quiz and review explanations','Revisit weak answers and summarize what you learned'][i%3]});save();render()}
function planHtml(){return '<div class="card"><div class="head"><div><h2>Your study schedule</h2><p>'+S.minutes+' minutes per day · '+S.plan.length+' sessions'+(S.date?' · Target '+S.date:'')+'</p></div><button class="btn" onclick="S.plan=null;save();render()">Clear plan</button></div>'+S.plan.map(function(p){return '<div class="item"><div class="circle">'+p.day+'</div><div style="flex:1"><b>Day '+p.day+': '+tn(p.t)+'</b><p class="tiny muted">'+p.task+'</p><button class="btn" onclick="filter=\''+p.t+'\';startQuiz()">Practise topic →</button></div></div>'}).join('')+'</div>'}
function readiness(){var n=hist().length,a=acc(),read=n?Math.min(100,Math.round(a*.65+Math.min(n,20)*1.75+topics.filter(function(t){return mastery(t.id)>=70}).length*5)):0;var attempts=(S.attempts||[]).slice().reverse();var recent=attempts.length?'<div class="card" style="margin-top:18px"><h2>Quiz attempt history</h2><p class="tiny muted">Scores from completed sessions saved on this browser.</p>'+attempts.slice(0,8).map(function(x){return '<div class="item"><div class="circle">'+x.score+'%</div><div><b>'+x.correct+' of '+x.total+' correct</b><div class="tiny muted">'+x.date+' · '+(x.incorrect.length?x.incorrect.length+' to review':'No missed questions')+'</div></div></div>'}).join('')+'</div>':'<div class="card" style="margin-top:18px"><h2>Quiz attempt history</h2><p class="muted">Complete a quiz to save your first session score here.</p></div>';var missed=(attempts.length&&attempts[0].incorrect.length)?'<div class="card" style="margin-top:18px"><h2>Review your latest mistakes</h2>'+attempts[0].incorrect.map(function(x){return '<div class="item"><div><span class="pill">'+tn(x.topic)+'</span><h3>'+x.q+'</h3><p class="tiny muted">Your answer: '+x.selected+'</p><p><b>Correct answer:</b> '+x.answer+'</p><p>'+x.explanation+'</p></div></div>'}).join('')+'</div>':'';return '<div class="head"><div><h1>Readiness Tracker</h1><p>See what practice tells you and what to revise next.</p></div></div><div class="grid stats">'+stat('Questions answered',n,'Recorded attempts')+stat('Practice accuracy',n?a+'%':'—','Correct answers across attempts')+stat('Topics at 70%+ mastery',topics.filter(function(t){return mastery(t.id)>=70}).length+' / 3','Based on your answers')+stat('Review topics',S.review.length,'Areas queued for revision')+'</div><div class="grid two"><div class="card"><span class="pill">INDICATIVE LEARNING SIGNAL</span><h2 style="font-size:39px">'+(n?read+'%':'—')+'</h2><h3>'+(n?(read>=75?'Building confidence':read>=45?'Making progress':'Keep practising'):'Start with a diagnostic')+'</h3><p class="tiny muted">'+(n?'A prototype estimate based on accuracy, practice volume and topic mastery.':'Take a quiz to establish a baseline.')+'</p><div class="notice">This is not an official score, a prediction, or a guarantee of passing AZ-900.</div><button class="btn primary" onclick="startQuiz()">Continue practising →</button></div><div class="card"><h2>Topic mastery</h2>'+topicBars()+'<div class="row"><button class="btn" onclick="ffilter=\'review\';go(\'Flashcards\')">Review weak topics</button><button class="btn" onclick="go(\'Study Planner\')">Plan revision</button></div></div></div><div class="card" style="margin-top:18px"><h2>Recent activity</h2>'+(hist().length?hist().slice(-8).reverse().map(function(h){return '<div class="item"><div class="circle">'+(h.ok?'✓':'↻')+'</div><div><b>'+tn(h.t)+'</b><div class="tiny muted">'+(h.ok?'Correct answer':'Review recommended')+' · '+h.date+'</div></div></div>'}).join(''):'<p class="muted">Your activity appears here after you answer quiz questions.</p>')+recent+missed+'</div><div class="row"><button class="btn" onclick="resetAll()">Reset all progress</button></div>'}
function resetAll(){if(confirm('Reset all saved progress, review topics and study plan on this browser?')){localStorage.removeItem(key);S={history:[],review:[],plan:null,minutes:25,date:'',streak:0,last:''};render()}}
function render(){visit();document.getElementById('nav').innerHTML=pages.map(function(p){return '<button type="button" class="'+(p===page?'active':'')+'" data-page="'+p+'">'+p+'</button>'}).join('');var html=page==='Home'?home():page==='Quiz Coach'?quizPage():page==='Study Buddy'?buddy():page==='Flashcards'?flashPage():page==='Study Planner'?planner():readiness();document.getElementById('app').innerHTML=html+'<footer class="footer"><span>☁ CloudReady Africa · Learn cloud with confidence</span><span>Independent, unofficial study aid · Not affiliated with Microsoft</span><button type="button" class="btn" data-page="Readiness">About & readiness</button></footer>';}
document.addEventListener('click',function(event){var el=event.target.closest('button');if(!el)return;if(el.dataset.page){go(el.dataset.page);return;}if(el.dataset.studyTopic){showTopic(el.dataset.studyTopic);return;}if(el.dataset.reviewTopic){queue(el.dataset.reviewTopic);return;}if(el.dataset.practiseTopic){filter=el.dataset.practiseTopic;startQuiz();return;}});
render();
</script></main></body></html>
